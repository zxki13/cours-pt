name: Mettre à jour la liste des cours

on:
  push:
    branches: [main]
    paths:
      - "cours/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer cours.json
        run: python3 scripts/generer.py

      - name: Enregistrer la liste si elle a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cours.json
          git diff --cached --quiet || (git commit -m "Mise à jour automatique de la liste des cours" && git push)
